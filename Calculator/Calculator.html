<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="CSS/Calculator.css" />
</head>
<body>

    <div class="calculator-wrapper">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="toolbar-btn" id="themeToggle" aria-label="Toggle theme">🌙</button>
                <button class="toolbar-btn" id="historyToggle" aria-label="Toggle history">📋</button>
                <button class="toolbar-btn" id="sciToggle" aria-label="Toggle scientific mode">🔬</button>
            </div>
            <div class="toolbar-right">
                <button class="toolbar-btn" id="copyResult" aria-label="Copy result">📄 Copy</button>
            </div>
        </div>

        <!-- History Panel -->
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <span>History</span>
                <button class="history-clear-btn" id="clearHistory">Clear All</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="history-empty">No calculations yet</li>
            </ul>
        </div>

        <!-- Display -->
        <div class="display">
            <div class="display-expression" id="expressionDisplay"></div>
            <div class="display-result" id="resultDisplay">0</div>
        </div>

        <!-- Main Button Grid -->
        <div class="button-grid" id="buttonGrid">
            <!-- Row 1 -->
            <button class="btn btn-func" data-value="AC">AC</button>
            <button class="btn btn-func" data-value="⌫">⌫</button>
            <button class="btn btn-func" data-value="%">%</button>
            <button class="btn btn-operator" data-value="÷">÷</button>

            <!-- Row 2 -->
            <button class="btn btn-number" data-value="7">7</button>
            <button class="btn btn-number" data-value="8">8</button>
            <button class="btn btn-number" data-value="9">9</button>
            <button class="btn btn-operator" data-value="×">×</button>

            <!-- Row 3 -->
            <button class="btn btn-number" data-value="4">4</button>
            <button class="btn btn-number" data-value="5">5</button>
            <button class="btn btn-number" data-value="6">6</button>
            <button class="btn btn-operator" data-value="−">−</button>

            <!-- Row 4 -->
            <button class="btn btn-number" data-value="1">1</button>
            <button class="btn btn-number" data-value="2">2</button>
            <button class="btn btn-number" data-value="3">3</button>
            <button class="btn btn-operator" data-value="+">+</button>

            <!-- Row 5 -->
            <button class="btn btn-func" data-value="+/-">+/−</button>
            <button class="btn btn-number" data-value="0">0</button>
            <button class="btn btn-number" data-value=".">.</button>
            <button class="btn btn-equal" data-value="=">=</button>
        </div>

        <!-- Scientific Buttons (hidden by default) -->
        <div class="sci-grid" id="sciGrid">
            <button class="btn btn-sci" data-value="sin(">sin</button>
            <button class="btn btn-sci" data-value="cos(">cos</button>
            <button class="btn btn-sci" data-value="tan(">tan</button>
            <button class="btn btn-sci" data-value="log(">log</button>
            <button class="btn btn-sci" data-value="ln(">ln</button>
            <button class="btn btn-sci" data-value="√(">√</button>
            <button class="btn btn-sci" data-value="²">x²</button>
            <button class="btn btn-sci" data-value="³">x³</button>
            <button class="btn btn-sci" data-value="1/(">1/x</button>
            <button class="btn btn-sci" data-value="π">π</button>
            <button class="btn btn-sci" data-value="e">e</button>
            <button class="btn btn-sci" data-value="(">(</button>
            <button class="btn btn-sci" data-value=")">)</button>
            <button class="btn btn-sci" data-value="//">//</button>
            <button class="btn btn-sci" data-value="!">!</button>
            <button class="btn btn-sci" data-value="^">x^y</button>
        </div>
    </div>

    <script src="JavaScript/Calculator.js"></script>
</body>
</html>
