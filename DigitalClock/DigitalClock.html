<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock · Live</title>
  <!-- CSS only (separate file) -->
  <link rel="stylesheet" href="CSS/DigitalClock.css">
  <!-- Font Awesome for icons (optional but nice) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <!-- header -->
  <header>
    <h1><i class="fas fa-clock"></i> Digital · Live Clock</h1>
  </header>

  <!-- main clock display -->
  <section class="clock-display" id="clockDisplay">
    <div class="time" id="timeDisplay">00:00:00</div>
    <div class="am-pm" id="amPmDisplay">AM</div>
    <div class="date" id="dateDisplay">Monday 1 January 2026</div>
  </section>

  <!-- control panel: format, theme, timezone, extra -->
  <div class="controls">
    <div class="control-group">
      <span class="label">Format</span>
      <button class="btn active" id="btn12h">12h</button>
      <button class="btn" id="btn24h">24h</button>
    </div>
    <div class="control-group">
      <span class="label">Theme</span>
      <button class="btn" id="themeLight"><i class="fas fa-sun"></i> Light</button>
      <button class="btn" id="themeDark"><i class="fas fa-moon"></i> Dark</button>
      <button class="btn" id="themeBlue">Blue</button>
      <button class="btn" id="themeGreen">Green</button>
    </div>
    <div class="control-group">
      <button class="btn" id="fullscreenBtn"><i class="fas fa-expand"></i> Full</button>
      <button class="btn" id="minimalBtn"><i class="fas fa-compress"></i> Minimal</button>
    </div>
  </div>

  <!-- world clocks (10 cities) -->
  <section class="world-clocks">
    <h2><i class="fas fa-globe"></i> World Clocks</h2>
    <div class="world-grid" id="worldGrid">
      <!-- populated by js -->
    </div>
  </section>

  <!-- stopwatch & alarm & countdown (extra features) -->
  <section class="extra-tools">
    <div class="tool-card" id="stopwatchCard">
      <h3><i class="fas fa-stopwatch"></i> Stopwatch</h3>
      <div class="stopwatch-display" id="stopwatchDisplay">00:00:00</div>
      <div>
        <button class="btn" id="swStart">Start</button>
        <button class="btn" id="swStop">Stop</button>
        <button class="btn" id="swReset">Reset</button>
      </div>
    </div>
    <div class="tool-card" id="alarmCard">
      <h3><i class="fas fa-bell"></i> Alarm</h3>
      <div class="alarm-set">
        <input type="time" id="alarmInput" value="08:00">
        <button class="btn" id="alarmSetBtn">Set</button>
        <button class="btn" id="alarmClearBtn">Clear</button>
      </div>
      <div id="alarmStatus">⏰ Alarm not set</div>
    </div>
    <div class="tool-card" id="countdownCard">
      <h3><i class="fas fa-hourglass-half"></i> Countdown</h3>
      <div class="countdown-set">
        <input type="number" id="cdMinutes" placeholder="min" min="0" value="5">
        <input type="number" id="cdSeconds" placeholder="sec" min="0" value="0">
        <button class="btn" id="cdStart">Start</button>
        <button class="btn" id="cdReset">Reset</button>
      </div>
      <div class="countdown-display" id="countdownDisplay">05:00</div>
    </div>
  </section>

  <!-- footer -->
  <footer>
    <p>Made with <i class="fas fa-heart" style="color: #e74c3c;"></i> HTML, CSS &amp; JavaScript · <span id="footerYear">2026</span></p>
  </footer>

  <!-- JavaScript separate file -->
  <script src="JavaScript/DigitalClock.js"></script>
</body>
</html>
