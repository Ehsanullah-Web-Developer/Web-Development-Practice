<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowWise · Expense Tracker</title>
  <link rel="stylesheet" href="CSS/ExpenseTracker.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1><i class="fas fa-wallet"></i> FlowWise</h1>
        <span class="tagline">smart expense tracker</span>
      </div>
      <div class="header-right">
        <span id="currentDate" class="date-badge"></span>
        <button id="themeToggle" class="icon-btn" title="Toggle theme"><i class="fas fa-moon"></i></button>
      </div>
    </header>

    <!-- Dashboard -->
    <section class="dashboard">
      <div class="balance-card total-balance">
        <span class="label">Total Balance</span>
        <span id="totalBalance" class="value">PKR 0</span>
      </div>
      <div class="balance-card income-card">
        <span class="label"><i class="fas fa-arrow-up" style="color:#2e7d32;"></i> Income</span>
        <span id="totalIncome" class="value">PKR 0</span>
      </div>
      <div class="balance-card expense-card">
        <span class="label"><i class="fas fa-arrow-down" style="color:#c62828;"></i> Expenses</span>
        <span id="totalExpenses" class="value">PKR 0</span>
      </div>
    </section>

    <!-- Add Transaction Form -->
    <section class="add-transaction">
      <h2><i class="fas fa-plus-circle"></i> Add Transaction</h2>
      <form id="transactionForm">
        <div class="form-grid">
          <div class="input-group">
            <label><i class="fas fa-tag"></i> Title</label>
            <input type="text" id="txTitle" placeholder="e.g. Groceries" required />
          </div>
          <div class="input-group">
            <label><i class="fas fa-dollar-sign"></i> Amount</label>
            <input type="number" id="txAmount" placeholder="0" min="0.01" step="0.01" required />
          </div>
          <div class="input-group">
            <label><i class="fas fa-exchange-alt"></i> Type</label>
            <select id="txType">
              <option value="income">Income</option>
              <option value="expense" selected>Expense</option>
            </select>
          </div>
          <div class="input-group">
            <label><i class="fas fa-list"></i> Category</label>
            <select id="txCategory"></select>
          </div>
          <div class="input-group">
            <label><i class="fas fa-calendar-alt"></i> Date</label>
            <input type="date" id="txDate" required />
          </div>
          <div class="input-group" style="justify-content: flex-end;">
            <button type="submit" class="btn primary"><i class="fas fa-save"></i> Add</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-filter">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search title or category..." />
        </div>
        <div class="filter-box">
          <select id="filterType">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="filterCategory">
            <option value="all">All Categories</option>
          </select>
          <input type="date" id="filterDate" title="Filter by date" />
          <button id="clearFilters" class="btn outline small"><i class="fas fa-times"></i> Clear</button>
        </div>
      </div>
      <div class="action-buttons">
        <select id="sortSelect" class="btn outline small">
          <option value="date-desc">Sort by Date (newest)</option>
          <option value="date-asc">Sort by Date (oldest)</option>
          <option value="amount-desc">Sort by Amount (high→low)</option>
          <option value="amount-asc">Sort by Amount (low→high)</option>
        </select>
        <button id="deleteAllBtn" class="btn danger small"><i class="fas fa-trash-alt"></i> Delete All</button>
        <button id="downloadBtn" class="btn secondary small"><i class="fas fa-download"></i> Download</button>
        <button id="printBtn" class="btn secondary small"><i class="fas fa-print"></i> Print</button>
      </div>
    </div>

    <!-- Transaction List -->
    <section class="transaction-list-section">
      <h2><i class="fas fa-list-ul"></i> Transactions <span id="txCount" class="badge">0</span></h2>
      <div id="transactionList" class="transaction-list"></div>
    </section>

    <!-- Charts & Budget -->
    <section class="charts-section">
      <div class="chart-row">
        <div class="chart-card">
          <h3>Expenses by Category <i class="fas fa-chart-pie"></i></h3>
          <canvas id="pieChart" width="200" height="200"></canvas>
        </div>
        <div class="chart-card">
          <h3>Monthly Spending <i class="fas fa-chart-bar"></i></h3>
          <canvas id="barChart" width="300" height="180"></canvas>
        </div>
        <div class="chart-card budget-card">
          <h3>Budget Limit <i class="fas fa-exclamation-triangle"></i></h3>
          <div class="budget-control">
            <input type="number" id="budgetLimit" placeholder="Set budget (PKR)" step="100" />
            <button id="setBudgetBtn" class="btn primary small">Set</button>
          </div>
          <div id="budgetStatus" class="budget-status">No budget set</div>
        </div>
      </div>
    </section>

    <!-- Currency Selector -->
    <div class="currency-selector">
      <label><i class="fas fa-coins"></i> Currency: </label>
      <select id="currencySelect">
        <option value="PKR">PKR ₨</option>
        <option value="USD">USD $</option>
        <option value="EUR">EUR €</option>
      </select>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-content">
        <p>&copy; 2026 FlowWise. All rights reserved.</p>
        <nav class="footer-nav">
          <a href="#"><i class="fas fa-home"></i> Home</a>
          <a href="#"><i class="fas fa-info-circle"></i> About</a>
          <a href="#"><i class="fas fa-envelope"></i> Contact</a>
        </nav>
        <p class="footer-credit">Made with <i class="fas fa-heart" style="color:#e74c3c;"></i> using HTML, CSS &amp; JavaScript</p>
      </div>
    </footer>
  </div>

  <!-- Modal Overlay -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="JavaScript/ExpenseTracker.js"></script>
</body>
</html>
